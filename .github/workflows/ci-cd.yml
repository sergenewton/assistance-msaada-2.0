# ⚙️ GitHub Actions Workflow - VBG Platform

name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18'
  PHP_VERSION: '8.1'
  FLUTTER_VERSION: '3.24.3'

jobs:
  # ===================================
  # VALIDATION & LINT
  # ===================================
  lint:
    name: 🔍 Lint & Format Check
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 📋 Validate Conventional Commits
        uses: wagoid/commitlint-github-action@v5
        if: github.event_name == 'pull_request'
        
      - name: 🎯 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none
          
      - name: 📱 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          
      # Frontend Lint
      - name: 🔍 Frontend Lint
        working-directory: ./frontend-web
        run: |
          npm ci
          npm run lint
          npm run type-check
          
      # Backend Lint  
      - name: 🔍 Backend Lint
        working-directory: ./backend-api
        run: |
          composer install --no-dev --optimize-autoloader
          ./vendor/bin/pint --test
          
      # Mobile Lint
      - name: 🔍 Mobile Lint & Format
        working-directory: ./mobile-app
        run: |
          flutter pub get
          dart format --set-exit-if-changed .
          flutter analyze

  # ===================================
  # TESTS BACKEND
  # ===================================
  test-backend:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: vbg_platform_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
        
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: xdebug
          
      - name: 🔧 Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: composer-${{ hashFiles('backend-api/composer.lock') }}
          
      - name: 📦 Install dependencies
        working-directory: ./backend-api
        run: composer install --no-progress --prefer-dist --optimize-autoloader
        
      - name: 🔑 Generate app key
        working-directory: ./backend-api
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan jwt:secret
          
      - name: 🗄️ Run database migrations
        working-directory: ./backend-api
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: vbg_platform_test
          DB_USERNAME: root
          DB_PASSWORD: password
          
      - name: 🧪 Run tests
        working-directory: ./backend-api
        run: php artisan test --coverage --min=80

  # ===================================
  # TESTS FRONTEND
  # ===================================
  test-frontend:
    name: 🧪 Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🎯 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './frontend-web/package-lock.json'
          
      - name: 📦 Install dependencies
        working-directory: ./frontend-web
        run: npm ci
        
      - name: 🧪 Run tests
        working-directory: ./frontend-web
        run: npm run test:coverage
        
      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./frontend-web/coverage/lcov.info
          flags: frontend

  # ===================================
  # TESTS MOBILE  
  # ===================================
  test-mobile:
    name: 🧪 Mobile Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 📱 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          
      - name: 📦 Install dependencies
        working-directory: ./mobile-app
        run: flutter pub get
        
      - name: 🔨 Generate code
        working-directory: ./mobile-app
        run: flutter pub run build_runner build --delete-conflicting-outputs
        
      - name: 🧪 Run tests
        working-directory: ./mobile-app
        run: flutter test --coverage
        
      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./mobile-app/coverage/lcov.info
          flags: mobile

  # ===================================
  # BUILD & SECURITY
  # ===================================
  build:
    name: 🏗️ Build & Security Scan
    runs-on: ubuntu-latest
    needs: [lint, test-backend, test-frontend, test-mobile]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      # Frontend Build
      - name: 🎯 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './frontend-web/package-lock.json'
          
      - name: 🏗️ Build Frontend
        working-directory: ./frontend-web
        run: |
          npm ci
          npm run build
          
      # Mobile Build (Android)
      - name: 📱 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          
      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          
      - name: 🤖 Build Android APK
        working-directory: ./mobile-app
        run: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
          flutter build apk --debug
          
      # Security Scan
      - name: 🔒 Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          
      - name: 📊 Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ===================================
  # DEPLOY STAGING
  # ===================================
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/develop'
    
    environment: staging
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🚀 Deploy to Staging
        run: |
          echo "🚧 Deploying to staging environment..."
          # Add your staging deployment commands here
          
      - name: 🔗 Update deployment status
        run: |
          echo "✅ Staging deployment completed"
          echo "🌐 Staging URL: https://staging.vbg-platform.com"

  # ===================================
  # DEPLOY PRODUCTION
  # ===================================
  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    
    environment: production
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🚀 Deploy to Production
        run: |
          echo "🚀 Deploying to production environment..."
          # Add your production deployment commands here
          
      - name: 🔗 Update deployment status
        run: |
          echo "✅ Production deployment completed"
          echo "🌐 Production URL: https://vbg-platform.com"
          
      - name: 📢 Notify deployment
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          text: "🚀 VBG Platform deployed to production"