# ==========================================
# DOCKER COMPOSE - PRODUCTION ENVIRONMENT
# ASSISTANCE MSAADA 2.0
# ==========================================

version: '3.8'

networks:
  assistance-msaada-prod:
    driver: bridge
  monitoring:
    driver: bridge

volumes:
  mysql_data_prod:
  redis_data_prod:
  prometheus_data:
  grafana_data:
  letsencrypt:
  nginx_logs:

services:
  # ========================================
  # DATABASE - MySQL 8.0 (Production)
  # ========================================
  mysql:
    image: mysql:8.0
    container_name: assistance-msaada-mysql-prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: assistance_msaada_production
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data_prod:/var/lib/mysql
      - ./docker/mysql/production.cnf:/etc/mysql/conf.d/custom.cnf
      - ./backups/mysql:/backups
    networks:
      - assistance-msaada-prod
    command: >
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=1G
      --max-connections=1000
      --query-cache-type=1
      --query-cache-size=64M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  # ========================================
  # REDIS CLUSTER - Cache & Sessions (Production)
  # ========================================
  redis-master:
    image: redis:7-alpine
    container_name: assistance-msaada-redis-master
    restart: always
    volumes:
      - redis_data_prod:/data
      - ./docker/redis/production.conf:/usr/local/etc/redis/redis.conf
    networks:
      - assistance-msaada-prod
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========================================
  # BACKEND API - Laravel (Production)
  # ========================================
  api:
    build:
      context: ./backend-api
      dockerfile: Dockerfile.production
      args:
        - APP_ENV=production
    image: assistance-msaada/api:latest
    container_name: assistance-msaada-api-prod
    restart: always
    environment:
      - APP_ENV=production
      - DB_HOST=mysql
      - DB_DATABASE=assistance_msaada_production
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis-master
    volumes:
      - ./storage:/var/www/html/storage
      - ./docker/php/production.ini:/usr/local/etc/php/conf.d/custom.ini
      - nginx_logs:/var/log/nginx
    depends_on:
      mysql:
        condition: service_healthy
      redis-master:
        condition: service_healthy
    networks:
      - assistance-msaada-prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 2  # Load balancing
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  # ========================================
  # FRONTEND WEB - React (Production)
  # ========================================
  web:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile.production
      args:
        - VITE_APP_ENV=production
        - VITE_API_BASE_URL=https://api.assistance-msaada.org/api/v1
    image: assistance-msaada/web:latest
    container_name: assistance-msaada-web-prod
    restart: always
    depends_on:
      - api
    networks:
      - assistance-msaada-prod
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 2  # Load balancing
      resources:
        limits:
          memory: 512M
          cpus: '0.25'

  # ========================================
  # QUEUE WORKERS - Laravel Queue (Production)
  # ========================================
  queue-critical:
    build:
      context: ./backend-api
      dockerfile: Dockerfile.production
    image: assistance-msaada/api:latest
    container_name: assistance-msaada-queue-critical
    restart: always
    environment:
      - APP_ENV=production
      - DB_HOST=mysql
      - REDIS_HOST=redis-master
      - QUEUE_CONNECTION=redis
    volumes:
      - ./storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis-master:
        condition: service_healthy
    networks:
      - assistance-msaada-prod
    command: php artisan queue:work redis --queue=critical --tries=3 --timeout=60 --sleep=1
    deploy:
      replicas: 3  # High availability for critical tasks

  queue-default:
    build:
      context: ./backend-api
      dockerfile: Dockerfile.production
    image: assistance-msaada/api:latest
    container_name: assistance-msaada-queue-default
    restart: always
    environment:
      - APP_ENV=production
      - DB_HOST=mysql
      - REDIS_HOST=redis-master
      - QUEUE_CONNECTION=redis
    volumes:
      - ./storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis-master:
        condition: service_healthy
    networks:
      - assistance-msaada-prod
    command: php artisan queue:work redis --queue=default --tries=3 --timeout=120 --sleep=3
    deploy:
      replicas: 2

  # ========================================
  # CRON SCHEDULER - Laravel Schedule (Production)
  # ========================================
  scheduler:
    build:
      context: ./backend-api
      dockerfile: Dockerfile.production
    image: assistance-msaada/api:latest
    container_name: assistance-msaada-scheduler-prod
    restart: always
    environment:
      - APP_ENV=production
      - DB_HOST=mysql
      - REDIS_HOST=redis-master
    volumes:
      - ./storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis-master:
        condition: service_healthy
    networks:
      - assistance-msaada-prod
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"

  # ========================================
  # REVERSE PROXY - Nginx + SSL (Production)
  # ========================================
  nginx:
    image: nginx:alpine
    container_name: assistance-msaada-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl.conf:/etc/nginx/conf.d/ssl.conf
      - letsencrypt:/etc/letsencrypt
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
      - web
    networks:
      - assistance-msaada-prod
      - monitoring
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # ========================================
  # SSL CERTIFICATES - Let's Encrypt
  # ========================================
  certbot:
    image: certbot/certbot
    container_name: assistance-msaada-certbot
    restart: "no"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - ./docker/certbot/www:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email admin@assistance-msaada.org --agree-tos --no-eff-email -d assistance-msaada.org -d api.assistance-msaada.org

  # ========================================
  # MONITORING - Prometheus (Production)
  # ========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: assistance-msaada-prometheus-prod
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/production.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - monitoring
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'

  # ========================================
  # MONITORING - Grafana (Production)
  # ========================================
  grafana:
    image: grafana/grafana:latest
    container_name: assistance-msaada-grafana-prod
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    ports:
      - "3001:3000"
    volumes:
      - ./docker/grafana/production:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring

  # ========================================
  # LOG AGGREGATION - ELK Stack (Optional)
  # ========================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
    container_name: assistance-msaada-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - ./docker/elasticsearch/data:/usr/share/elasticsearch/data
    networks:
      - monitoring
    ports:
      - "9200:9200"

  # ========================================
  # BACKUP SERVICE
  # ========================================
  backup:
    build:
      context: ./docker/backup
      dockerfile: Dockerfile
    container_name: assistance-msaada-backup
    restart: always
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_BACKUP_BUCKET=${S3_BACKUP_BUCKET}
    volumes:
      - mysql_data_prod:/data/mysql:ro
      - ./storage:/data/storage:ro
      - ./backups:/backups
    depends_on:
      - mysql
    networks:
      - assistance-msaada-prod
    command: sh -c "while true; do /backup.sh; sleep 86400; done"  # Daily backup