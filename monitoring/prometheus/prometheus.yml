# Prometheus Configuration for Assistance Msaada 2.0
# Staging Environment

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'staging'
    project: 'assistance-msaada'

# Rules and alerting
rule_files:
  - "rules/*.yml"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter (System metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s

  # Backend Laravel applications
  - job_name: 'backend-laravel'
    static_configs:
      - targets: 
          - 'backend-staging:8000'
          - 'backend-staging-2:8000'
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # MySQL Exporter
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysql-exporter:9104']
    scrape_interval: 30s

  # Redis Exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s

  # Nginx/Traefik metrics
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8080']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Docker container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 30s

  # Laravel Queue metrics
  - job_name: 'laravel-queue'
    static_configs:
      - targets: ['queue-worker-staging:8001']
    metrics_path: '/metrics'
    scrape_interval: 60s

  # Custom application metrics
  - job_name: 'app-metrics'
    static_configs:
      - targets: ['backend-staging:8000']
    metrics_path: '/api/metrics'
    scrape_interval: 60s
    bearer_token_file: /etc/prometheus/tokens/app_token

  # Blackbox exporter (external monitoring)
  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - https://staging.assistance-msaada.org
        - https://api-staging.assistance-msaada.org/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

# Remote write (for long-term storage)
remote_write:
  - url: "https://prometheus-remote.assistance-msaada.org/api/v1/write"
    basic_auth:
      username: "${PROMETHEUS_REMOTE_USER}"
      password: "${PROMETHEUS_REMOTE_PASSWORD}"