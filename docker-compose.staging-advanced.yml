# =============================================================================
# DOCKER COMPOSE STAGING - ASSISTANCE MSAADA 2.0
# Configuration serveur staging avec monitoring complet
# =============================================================================

services:
  # =============================================================================
  # REVERSE PROXY & LOAD BALANCER
  # =============================================================================
  traefik:
    image: traefik:v3.0
    container_name: msaada-traefik-staging
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=devops@assistance-msaada.org
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --metrics.prometheus=true
      - --metrics.prometheus.addEntryPointsLabels=true
      - --metrics.prometheus.addServicesLabels=true
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Dashboard Traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
      - ./config/traefik:/etc/traefik:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`traefik-staging.assistance-msaada.org`)
      - traefik.http.routers.traefik.tls.certresolver=letsencrypt
      - traefik.http.services.traefik.loadbalancer.server.port=8080
    networks:
      - msaada-network
    environment:
      - TRAEFIK_API_DASHBOARD=true
      - TRAEFIK_API_INSECURE=false

  # =============================================================================
  # BACKEND LARAVEL (SCALABLE)
  # =============================================================================
  backend-staging:
    image: sergenewton/assistance-msaada-backend:staging
    container_name: msaada-backend-staging-1
    restart: unless-stopped
    build:
      context: ../backend-api
      dockerfile: Dockerfile.production
      target: production
    env_file:
      - ../backend-api/.env.staging
    environment:
      - APP_ENV=staging
      - APP_DEBUG=false
      - DB_HOST=db-staging
      - REDIS_HOST=redis-staging
      - SENTRY_DSN=${SENTRY_DSN_BACKEND}
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_logs:/var/www/html/storage/logs
    depends_on:
      db-staging:
        condition: service_healthy
      redis-staging:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend-staging.rule=Host(`api-staging.assistance-msaada.org`)
      - traefik.http.routers.backend-staging.tls.certresolver=letsencrypt
      - traefik.http.services.backend-staging.loadbalancer.server.port=8000
      - traefik.http.middlewares.backend-cors.headers.accesscontrolallowmethods=GET,OPTIONS,PUT,POST,DELETE,PATCH
      - traefik.http.middlewares.backend-cors.headers.accesscontrolallowheaders=*
      - traefik.http.middlewares.backend-cors.headers.accesscontrolalloworiginlist=https://staging.assistance-msaada.org
      - traefik.http.routers.backend-staging.middlewares=backend-cors
    networks:
      - msaada-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Backend replica pour load balancing
  backend-staging-2:
    image: sergenewton/assistance-msaada-backend:staging
    container_name: msaada-backend-staging-2
    restart: unless-stopped
    build:
      context: ../backend-api
      dockerfile: Dockerfile.production
      target: production
    env_file:
      - ../backend-api/.env.staging
    environment:
      - APP_ENV=staging
      - APP_DEBUG=false
      - DB_HOST=db-staging
      - REDIS_HOST=redis-staging
      - SENTRY_DSN=${SENTRY_DSN_BACKEND}
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_logs:/var/www/html/storage/logs
    depends_on:
      db-staging:
        condition: service_healthy
      redis-staging:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.services.backend-staging.loadbalancer.server.port=8000
    networks:
      - msaada-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # =============================================================================
  # FRONTEND REACT
  # =============================================================================
  frontend-staging:
    image: sergenewton/assistance-msaada-frontend:staging
    container_name: msaada-frontend-staging
    restart: unless-stopped
    build:
      context: ../frontend-web
      dockerfile: Dockerfile
      target: production
      args:
        - VITE_API_URL=https://api-staging.assistance-msaada.org
        - VITE_APP_ENV=staging
        - VITE_SENTRY_DSN=${SENTRY_DSN_FRONTEND}
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend-staging.rule=Host(`staging.assistance-msaada.org`)
      - traefik.http.routers.frontend-staging.tls.certresolver=letsencrypt
      - traefik.http.services.frontend-staging.loadbalancer.server.port=80
      - traefik.http.middlewares.frontend-security.headers.frameDeny=true
      - traefik.http.middlewares.frontend-security.headers.contentTypeNosniff=true
      - traefik.http.middlewares.frontend-security.headers.browserXssFilter=true
      - traefik.http.routers.frontend-staging.middlewares=frontend-security
    networks:
      - msaada-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # BASE DE DONNÉES MYSQL AVEC RÉPLICATION
  # =============================================================================
  db-staging:
    image: mysql:8.0
    container_name: msaada-db-staging-master
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${STAGING_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: assistance_msaada_staging
      MYSQL_USER: assistance_user
      MYSQL_PASSWORD: ${STAGING_DB_PASSWORD}
      # Réplication MySQL
      MYSQL_REPLICATION_MODE: master
      MYSQL_REPLICATION_USER: replicator
      MYSQL_REPLICATION_PASSWORD: ${MYSQL_REPLICATION_PASSWORD}
    volumes:
      - db_data_staging:/var/lib/mysql
      - ./config/mysql/staging:/etc/mysql/conf.d:ro
      - ./backups/mysql:/backups
    ports:
      - "3306:3306"
    networks:
      - msaada-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "assistance_user", "-p${STAGING_DB_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=512M
      --max-connections=200
      --slow-query-log=1
      --long-query-time=2

  # Réplica en lecture seule
  db-staging-replica:
    image: mysql:8.0
    container_name: msaada-db-staging-replica
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${STAGING_DB_ROOT_PASSWORD}
      MYSQL_REPLICATION_MODE: slave
      MYSQL_REPLICATION_USER: replicator
      MYSQL_REPLICATION_PASSWORD: ${MYSQL_REPLICATION_PASSWORD}
      MYSQL_MASTER_HOST: db-staging
      MYSQL_MASTER_PORT_NUMBER: 3306
    volumes:
      - db_replica_data_staging:/var/lib/mysql
      - ./config/mysql/staging:/etc/mysql/conf.d:ro
    depends_on:
      db-staging:
        condition: service_healthy
    networks:
      - msaada-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5

  # =============================================================================
  # REDIS CLUSTER
  # =============================================================================
  redis-staging:
    image: redis:7-alpine
    container_name: msaada-redis-staging-master
    restart: unless-stopped
    command: >
      redis-server 
      --appendonly yes 
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data_staging:/data
      - ./config/redis/staging.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    networks:
      - msaada-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # QUEUE WORKERS
  # =============================================================================
  queue-worker-staging:
    image: sergenewton/assistance-msaada-backend:staging
    container_name: msaada-queue-staging
    restart: unless-stopped
    env_file:
      - ../backend-api/.env.staging
    environment:
      - APP_ENV=staging
      - DB_HOST=db-staging
      - REDIS_HOST=redis-staging
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_logs:/var/www/html/storage/logs
    depends_on:
      db-staging:
        condition: service_healthy
      redis-staging:
        condition: service_healthy
    networks:
      - msaada-network

  # =============================================================================
  # SCHEDULER (CRON JOBS)
  # =============================================================================
  scheduler-staging:
    image: sergenewton/assistance-msaada-backend:staging
    container_name: msaada-scheduler-staging
    restart: unless-stopped
    env_file:
      - ../backend-api/.env.staging
    environment:
      - APP_ENV=staging
      - DB_HOST=db-staging
      - REDIS_HOST=redis-staging
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction &
        sleep 60
      done"
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_logs:/var/www/html/storage/logs
    depends_on:
      - db-staging
      - redis-staging
    networks:
      - msaada-network

  # =============================================================================
  # MONITORING - PROMETHEUS
  # =============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: msaada-prometheus-staging
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    labels:
      - traefik.enable=true
      - traefik.http.routers.prometheus-staging.rule=Host(`prometheus-staging.assistance-msaada.org`)
      - traefik.http.routers.prometheus-staging.tls.certresolver=letsencrypt
      - traefik.http.services.prometheus-staging.loadbalancer.server.port=9090
      - traefik.http.middlewares.prometheus-auth.basicauth.users=admin:$$2y$$10$$X8S8wT4..hashpassword
      - traefik.http.routers.prometheus-staging.middlewares=prometheus-auth
    networks:
      - msaada-network

  # =============================================================================
  # MONITORING - GRAFANA
  # =============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: msaada-grafana-staging
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_DOMAIN=grafana-staging.assistance-msaada.org
      - GF_SERVER_ROOT_URL=https://grafana-staging.assistance-msaada.org
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel,redis-datasource
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=${SMTP_HOST}:${SMTP_PORT}
      - GF_SMTP_USER=${SMTP_USER}
      - GF_SMTP_PASSWORD=${SMTP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=alerts@assistance-msaada.org
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana-staging.rule=Host(`grafana-staging.assistance-msaada.org`)
      - traefik.http.routers.grafana-staging.tls.certresolver=letsencrypt
      - traefik.http.services.grafana-staging.loadbalancer.server.port=3000
    networks:
      - msaada-network
    depends_on:
      - prometheus

  # =============================================================================
  # MONITORING - NODE EXPORTER
  # =============================================================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: msaada-node-exporter-staging
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"
    networks:
      - msaada-network

  # =============================================================================
  # MONITORING - ALERTMANAGER
  # =============================================================================
  alertmanager:
    image: prom/alertmanager:latest
    container_name: msaada-alertmanager-staging
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=https://alerts-staging.assistance-msaada.org'
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    labels:
      - traefik.enable=true
      - traefik.http.routers.alertmanager-staging.rule=Host(`alerts-staging.assistance-msaada.org`)
      - traefik.http.routers.alertmanager-staging.tls.certresolver=letsencrypt
      - traefik.http.services.alertmanager-staging.loadbalancer.server.port=9093
    networks:
      - msaada-network

  # =============================================================================
  # LOGS - LOKI
  # =============================================================================
  loki:
    image: grafana/loki:latest
    container_name: msaada-loki-staging
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki:/etc/loki:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - msaada-network

  # =============================================================================
  # LOGS - PROMTAIL
  # =============================================================================
  promtail:
    image: grafana/promtail:latest
    container_name: msaada-promtail-staging
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail:/etc/promtail:ro
      - /var/log:/var/log:ro
      - backend_logs:/var/log/laravel:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - msaada-network
    depends_on:
      - loki

  # =============================================================================
  # BACKUP AUTOMATIQUE
  # =============================================================================
  backup-service:
    image: alpine:latest
    container_name: msaada-backup-staging
    restart: unless-stopped
    environment:
      - BACKUP_SCHEDULE=0 2 * * *  # Tous les jours à 2h
      - MYSQL_HOST=db-staging
      - MYSQL_USER=assistance_user
      - MYSQL_PASSWORD=${STAGING_DB_PASSWORD}
      - MYSQL_DATABASE=assistance_msaada_staging
      - S3_BUCKET=${BACKUP_S3_BUCKET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    volumes:
      - ./scripts/backup:/backup-scripts:ro
      - ./backups:/backups
      - backend_storage:/data/storage:ro
    command: |
      sh -c "
        apk add --no-cache mysql-client aws-cli dcron
        crontab -l | { cat; echo \"$$BACKUP_SCHEDULE /backup-scripts/backup.sh\"; } | crontab -
        crond -f -L /dev/stdout
      "
    networks:
      - msaada-network
    depends_on:
      - db-staging

# =============================================================================
# VOLUMES PERSISTANTS
# =============================================================================
volumes:
  traefik_letsencrypt:
    driver: local
  db_data_staging:
    driver: local
  db_replica_data_staging:
    driver: local
  redis_data_staging:
    driver: local
  backend_storage:
    driver: local
  backend_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local
  loki_data:
    driver: local

# =============================================================================
# RÉSEAUX
# =============================================================================
networks:
  msaada-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16