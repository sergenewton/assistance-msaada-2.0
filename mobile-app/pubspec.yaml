name: assistance_msaada_2
description: "Plateforme de signalement et d'assistance médicale"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # État et navigation
  flutter_riverpod: ^2.4.0
  go_router: ^13.0.0

  # Réseau et API
  dio: ^5.4.0
  retrofit: ^4.0.3
  json_annotation: ^4.8.1

  # Stockage sécurisé
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Authentification
  local_auth: ^2.1.7

  # Notifications (Firebase temporairement désactivé)
  # firebase_core: ^2.24.2
  # firebase_messaging: ^14.7.9
  flutter_local_notifications: ^19.0.0

  # Chat et communication
  socket_io_client: ^2.0.3

  # Audio
  flutter_sound: ^9.2.13
  permission_handler: ^11.1.0
  geolocator: ^12.0.0

  # Image et fichiers
  image_picker: ^1.0.7
  file_picker: ^8.0.6
  cached_network_image: ^3.3.1

  # Chiffrement
  encrypt: ^5.0.3
  pointycastle: ^3.7.4

  # UI
  flutter_svg: ^2.0.9
  # Flutter 3.35 pins flutter_localizations to intl 0.20.2
  intl: ^0.20.2
  timeago: ^3.6.0
  shimmer: ^3.0.0

  # Localisation
  flutter_localizations:
    sdk: flutter

  # Utilitaires
  connectivity_plus: ^5.0.2
  url_launcher: ^6.2.3
  share_plus: ^7.2.1
  
  # Dépendances manquantes
  dartz: ^0.10.1
  equatable: ^2.0.5
  shared_preferences: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.7
  retrofit_generator: ^8.0.4
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.svg