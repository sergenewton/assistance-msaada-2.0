name: vbg_platform_mobile
description: "Application mobile pour la plateforme de signalement VBG"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  equatable: ^2.0.5
  
  # Network
  http: ^1.1.0
  dio: ^5.3.2
  pretty_dio_logger: ^1.3.1
  
  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # UI Components
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.7
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  
  # Forms & Validation
  formz: ^0.6.1
  
  # Navigation
  go_router: ^12.0.0
  
  # Utilities
  intl: ^0.18.1
  logger: ^2.0.2+1
  permission_handler: ^11.0.1
  image_picker: ^1.0.4
  file_picker: ^6.0.0
  geolocator: ^9.0.2
  dartz: ^0.10.1
  
  # Security
  crypto: ^3.0.3
  
  # Dependency Injection
  get_it: ^7.6.4
  injectable: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Code Generation
  build_runner: ^2.4.7
  hive_generator: ^2.0.1
  injectable_generator: ^2.4.1
  
  # Testing
  mocktail: ^1.0.0
  flutter_riverpod_test: ^1.0.0
  
  # Riverpod Code Generation
  riverpod_generator: ^2.3.9
  riverpod_lint: ^2.3.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/translations/
    
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700